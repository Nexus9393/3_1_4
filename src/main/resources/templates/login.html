<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <style>
        .main-content-centered {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            position: relative;
        }
        .form-group input {
            padding-left: 40px;
        }
        .form-group i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2" th:replace="~{fragments/sidebar :: sidebar}"></div>


        <div class="col-md-10" id="mainContentWrapper">
            <div id="mainContent" class="main-content-centered">
                <div class="login-form" th:unless="${#authentication != null}">
                    <h2>Please sign in</h2>
                    <div class="error-message" th:if="${param.error}">
                        Invalid email or password. Please try again.
                    </div>
                    <form method="post" th:action="@{/login}">
                        <div class="form-group">
                            <i class="fas fa-user" aria-hidden="true"></i>
                            <input type="text" name="username" placeholder="Email address" class="form-control" aria-label="Email address" required>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-lock" aria-hidden="true"></i>
                            <input type="password" name="password" placeholder="Password" class="form-control" aria-label="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<div th:replace="~{fragments/modals :: modals}"></div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js"></script>
<script th:src="@{/js/navigation.js}"></script>
</body>
</html>
